// Derived from the official GTCEu 1.20.1 Addon Template, revision documented in README.
plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}
version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}
sourceSets {
    main.resources { srcDir 'src/generated/resources' }
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
java.registerFeature('validation') { usingSourceSet(sourceSets.validation) }
repositories {
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content { includeGroup 'com.gregtechceu.gtceu' }
    }
    maven {
        url = 'https://maven.tterrag.com/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://cursemaven.com/'
        content { includeGroup 'curse.maven' }
    }
}
legacyForge {
    version = project.minecraft_version + '-' + project.forge_version
    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }
    runs {
        client { client(); sourceSet = sourceSets.main }
        server {
            server()
            sourceSet = sourceSets.main
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing',
                    file('src/main/resources').absolutePath, '--existing-mod', 'gtceu')
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
obfuscation { createRemappingConfiguration(configurations.validationCompileOnly) }
dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'
    // GT8 bundles its runtime libraries. Do not bring in the template's GT7-era LDLib/configuration.
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") { transitive = false }
    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    modValidationCompileOnly 'curse.maven:ftb-team-bases-1197857:7880652'
    modValidationCompileOnly 'curse.maven:ftb-teams-404468:7499810'
    modValidationCompileOnly 'curse.maven:ftb-library-404465:8226927'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
apply from: "$rootDir/gradle/scripts/spotless.gradle"
tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_license: mod_license, mod_id: mod_id, version: version,
                      mod_name: mod_name, mod_url: mod_url, mod_author: mod_author,
                      minecraft_version: minecraft_version, forge_version: forge_version,
                      gtceu_version_range: gtceu_version_range]
    inputs.properties(properties)
    filesMatching('META-INF/mods.toml') { expand properties + [project: project] }
    from('LICENSE.MD') { into 'META-INF'; rename { 'LICENSE-template-LGPL-3.0.txt' } }
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('validationJar', Jar) {
    archiveClassifier = 'validation'
}
obfuscation { reobfuscate(tasks.named('validationJar'), sourceSets.validation) }
tasks.register('installPack', Copy) {
    dependsOn 'reobfJar'
    from tasks.named('reobfJar')
    into '../mods'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
