name: worldgen-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate shipped pack data and indexed artifact
        run: python3 scripts/check-worldgen.py
      - name: Compile generator and test harness; test ring mathematics
        working-directory: worldgen
        run: ./gradlew test build reobfValidationJar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-test-reports
          path: worldgen/build/reports/tests/test
